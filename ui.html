<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 12px;
  background: #1e1e1e;
  color: #e3e3e3;
  padding: 16px;
  -webkit-font-smoothing: antialiased;
}

h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: #ffffff; display: flex; align-items: baseline; gap: 6px; }
.version { font-size: 10px; font-weight: 400; color: #8c8c8c; }

.block { background: #2c2c2c; border: 1px solid #383838; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.block-title { font-size: 10px; font-weight: 600; color: #8c8c8c; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

.btn-count { width: 100%; padding: 10px; background: #2c2c2c; color: #ffffff; border: 1px solid #383838; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s, border-color 0.15s; margin-bottom: 6px; }
.btn-count:hover:not(:disabled) { background: #333333; border-color: #444444; }
.btn-count:disabled { opacity: 0.5; cursor: not-allowed; }

.hint { font-size: 11px; color: #75777a; text-align: center; margin-bottom: 12px; }

.banks { display: flex; gap: 8px; margin-bottom: 10px; }
.bank { flex: 1; padding: 6px 8px; border-radius: 6px; background: #252525; border: 1px solid #2d2d2d; }
.bank .label { font-size: 9px; color: #8c8c8c; margin-bottom: 1px; }
.bank .val { font-size: 12px; font-weight: 600; }
.bank .val.blue { color: #18a0fb; }
.bank .val.purple { color: #a78bfa; }

.btn-group { display: flex; flex-direction: column; gap: 8px; }
.row-half { display: flex; gap: 6px; }

.btn-replace { width: 100%; border: none; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 6px; transition: background 0.15s, border-color 0.15s, opacity 0.15s; }
.btn-replace:disabled { opacity: 0.25; cursor: not-allowed; }

.btn-all { padding: 11px; background: #18a0fb; color: #ffffff; }
.btn-all:hover:not(:disabled) { background: #0d8de0; }

.btn-rec { padding: 11px; background: #2f254c; color: #c084fc; border: 1px solid #4a3672; }
.btn-rec:hover:not(:disabled) { background: #39295c; border-color: #5c458c; }

.btn-secondary { padding: 8px; background: transparent; font-size: 11px; }
.btn-people { color: #18a0fb; border: 1px solid #18a0fb33; }
.btn-people:hover:not(:disabled) { background: #18a0fb11; border-color: #18a0fb55; }
.btn-company { color: #a78bfa; border: 1px solid #a78bfa33; }
.btn-company:hover:not(:disabled) { background: #a78bfa11; border-color: #a78bfa55; }

.block-danger { border-color: #3f2222; }
.block-danger .block-title { color: #f87171; }
.btn-danger { padding: 8px; background: #3f1e1e; color: #f87171; border: 1px solid #5a2626; font-size: 11px; }
.btn-danger:hover:not(:disabled) { background: #502727; border-color: #723434; }

.note { font-size: 9.5px; color: #75777a; margin-top: 4px; text-align: center; line-height: 1.3; }

.collapse-toggle { width: 100%; padding: 7px 10px; background: #2c2c2c; border: 1px solid #383838; border-radius: 6px; color: #8c8c8c; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.collapse-toggle:hover { color: #ffffff; background: #333333; }
.collapse-toggle .arrow { transition: transform 0.2s; }
.collapse-toggle.open .arrow { transform: rotate(180deg); }
.node-list { overflow-y: auto; max-height: 140px; border: 1px solid #383838; border-top: none; border-radius: 0 0 6px 6px; background: #252525; display: none; }
.node-list.open { display: block; }
.node-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #2d2d2d; }
.node-item:last-child { border-bottom: none; }
.node-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #b3b3b3; font-size: 11px; }

.badge { font-size: 9px; padding: 1.5px 5px; border-radius: 4px; white-space: nowrap; font-weight: 500; }
.badge-both { background: #1a2a3a; color: #7ab8f5; }
.badge-people { background: #2d1c3a; color: #c084fc; }

.toast { display: none; margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; }
.toast.success { background: #1b351e; color: #44c348; display: block; border: 1px solid #234d28; }
.toast.error { background: #3b1c1c; color: #ff5f56; display: block; border: 1px solid #5a2626; }
</style>
</head>
<body>

<h2>Image Replacer <span class="version">ver. 0.1</span></h2>

<button class="btn-count" id="countBtn">🔍 Найти аватарки в выделении</button>
<div class="hint" id="hint">Выдели фрейм в Figma, затем нажми кнопку</div>

<div class="block block-danger">
  <div class="block-title">🧹 Очистка макета</div>
  <button class="btn-replace btn-danger" id="btnDeleteHidden">🗑 Удалить скрытые слои</button>
</div>

<div id="mainSection" style="display:none">

  <div class="block">
    <div class="block-title">🖼 Аватар</div>
    <div class="banks">
      <div class="bank">
        <div class="label">👤 Люди</div>
        <div class="val blue" id="peopleStatus">загрузка...</div>
      </div>
      <div class="bank">
        <div class="label">🏢 Компании</div>
        <div class="val purple" id="companyStatus">загрузка...</div>
      </div>
    </div>
    
    <div class="btn-group">
      <button class="btn-replace btn-all" id="btnAll" disabled>⚡ Все (человек + компания по связи)</button>
      <button class="btn-replace btn-rec" id="btnRec" disabled>★ Обновить в рекомендациях</button>
      
      <div class="row-half">
        <button class="btn-replace btn-secondary btn-people" id="btnPeople" disabled>👤 Только людей</button>
        <button class="btn-replace btn-secondary btn-company" id="btnCompany" disabled>🏢 Только компании</button>
      </div>
    </div>
    <div class="note">⚡ компания подставляется автоматически по связи<br>★ имя с переносом строки Shift+Enter</div>
  </div>

  <button class="collapse-toggle" id="toggleList">
    <span id="toggleLabel">Найденные аватарки</span>
    <span class="arrow">▼</span>
  </button>
  <div class="node-list" id="nodeList"></div>

</div>

<div class="toast" id="toast"></div>

<script>
// Твой репозиторий GitHub
var GITHUB_BASE_URL = "https://raw.githubusercontent.com/deponishe/replacer/main/";

var imagesBank = [];
var companyBank = [];

var personNames = [];
var personToCompany = {};
var personToName = {};
var personToJob = {};
var nameLayersConfig = [];
var jobLayersConfig = [];

var nodes = [];
var countBtn    = document.getElementById('countBtn');
var btnAll      = document.getElementById('btnAll');
var btnPeople   = document.getElementById('btnPeople');
var btnCompany  = document.getElementById('btnCompany');
var btnRec      = document.getElementById('btnRec');
var btnDelete   = document.getElementById('btnDeleteHidden');
var nodeList    = document.getElementById('nodeList');
var toggleList  = document.getElementById('toggleList');
var toggleLabel = document.getElementById('toggleLabel');
var mainSection = document.getElementById('mainSection');
var hint        = document.getElementById('hint');
var toast       = document.getElementById('toast');
var peopleStatus = document.getElementById('peopleStatus');
var companyStatus = document.getElementById('companyStatus');

async function fetchBinary(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error('Load failed');
  const buffer = await response.arrayBuffer();
  return Array.from(new Uint8Array(buffer));
}

async function fetchJSON(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error('JSON load failed');
  return await response.json();
}

// Загрузка абсолютно всех настроек и ресурсов напрямую из GitHub
async function startBootstrap() {
  try {
    // 1. Загружаем слой настроек edit.json
    const editConfig = await fetchJSON(GITHUB_BASE_URL + "edit.json");
    nameLayersConfig = editConfig.nameLayers.map(function(n) { return n.toLowerCase(); });
    jobLayersConfig = editConfig.jobLayers.map(function(n) { return n.toLowerCase(); });

    // 2. Загружаем связи links.json
    const links = await fetchJSON(GITHUB_BASE_URL + "links.json");

    // Парсим структуру links
    personNames = Object.keys(links);
    const companyFiles = [];

    personNames.forEach(function(key) {
      const data = links[key];
      personToName[key] = data.name;
      personToJob[key] = data.job;

      // Получаем имя фала компании
      const cFile = data.company;
      if (!companyFiles.includes(cFile)) {
        companyFiles.push(cFile);
      }
      // Запоминаем индекс файла в пуле компаний
      personToCompany[key] = companyFiles.indexOf(cFile);
    });

    // 3. Загружаем вшитые изображения людей из people/
    let loadedPeople = 0;
    personNames.forEach(async function(key, i) {
      try {
        const bytes = await fetchBinary(GITHUB_BASE_URL + "people/" + key + ".jpg");
        imagesBank[i] = bytes;
        loadedPeople++;
        peopleStatus.textContent = loadedPeople + " фото";
        updateButtonsState();
      } catch(e) {
        console.error("Failed load profile:", key, e);
      }
    });

    // 4. Загружаем логотипы компаний из company/
    let loadedCompanies = 0;
    companyFiles.forEach(async function(file, i) {
      try {
        const bytes = await fetchBinary(GITHUB_BASE_URL + "company/" + file);
        companyBank[i] = bytes;
        loadedCompanies++;
        companyStatus.textContent = loadedCompanies + " фото";
        updateButtonsState();
      } catch(e) {
        console.error("Failed load logo:", file, e);
      }
    });

  } catch(e) {
    showToast("Ошибка загрузки плагина с GitHub!", "error");
    console.error(e);
  }
}

function updateButtonsState() {
  var hasNodes = nodes.length > 0;
  var hasImages = imagesBank.filter(Boolean).length > 0;
  var hasCompanies = companyBank.filter(Boolean).length > 0;

  btnAll.disabled     = !(hasNodes && hasImages && hasCompanies);
  btnPeople.disabled  = !(hasNodes && hasImages);
  btnCompany.disabled = !(hasNodes && hasCompanies);
  btnRec.disabled     = !(hasNodes && hasImages && hasCompanies);
}

toggleList.addEventListener('click', function() {
  var isOpen = nodeList.classList.contains('open');
  if (isOpen) { nodeList.classList.remove('open'); toggleList.classList.remove('open'); }
  else { nodeList.classList.add('open'); toggleList.classList.add('open'); }
});

countBtn.addEventListener('click', function() {
  countBtn.textContent = 'Ищу...';
  countBtn.disabled = true;
  parent.postMessage({ pluginMessage: { type: 'count-nodes' } }, '*');
});

btnDelete.addEventListener('click', function() {
  btnDelete.disabled = true;
  btnDelete.textContent = 'Удаляю...';
  parent.postMessage({ pluginMessage: { type: 'delete-hidden' } }, '*');
});

function renderNodes() {
  var withAddon = nodes.filter(function(n) { return n.hasAddon; }).length;
  mainSection.style.display = 'block';
  hint.style.display = 'none';
  toggleLabel.textContent = 'Найдено: ' + nodes.length + ' аватарок (' + withAddon + ' c addon)';
  nodeList.innerHTML = nodes.length === 0
    ? '<div style="padding:14px;text-align:center;color:#666">Ничего не найдено</div>'
    : nodes.map(function(n) {
        var bc = n.hasAddon ? 'badge-both' : 'badge-people';
        var bt = n.hasAddon ? '👤+🏢' : '👤';
        return '<div class="node-item"><span class="node-name">' + n.name + '</span><span class="badge ' + bc + '">' + bt + '</span></div>';
      }).join('');
  
  updateButtonsState();

  btnAll.textContent     = '⚡ Все (' + nodes.length + ')';
  btnPeople.textContent  = '👤 Только людей (' + nodes.length + ')';
  btnCompany.textContent = '🏢 Только компании (' + nodes.length + ')';
  btnRec.textContent     = '★ Обновить в рекомендациях (' + nodes.length + ')';
}

function setAllDisabled(val) {
  btnAll.disabled = val; btnPeople.disabled = val;
  btnCompany.disabled = val; btnRec.disabled = val;
}

function sendReplace(filter) {
  if (!nodes.length) return;
  setAllDisabled(true);
  btnAll.textContent = 'Заменяю...';
  parent.postMessage({
    pluginMessage: {
      type: 'replace-images-random',
      nodeIds: nodes,
      imagesBank: imagesBank, 
      companyBank: companyBank,
      personNames: PERSON_NAMES,
      personToCompany: PERSON_TO_COMPANY,
      personToName: PERSON_TO_NAME,
      personToJob: PERSON_TO_JOB,
      nameLayers: NAME_LAYERS_CONFIG, 
      jobLayers: JOB_LAYERS_CONFIG,
      filter: filter
    }
  }, '*');
}

btnAll.addEventListener('click',     function() { sendReplace('all'); });
btnPeople.addEventListener('click',  function() { sendReplace('people'); });
btnCompany.addEventListener('click', function() { sendReplace('company'); });
btnRec.addEventListener('click',     function() { sendReplace('rec'); });

window.onmessage = function(event) {
  var msg = event.data.pluginMessage;
  if (!msg) return;
  
  if (msg.type === 'image-nodes') {
    countBtn.textContent = '🔍 Найти аватарки в выделении';
    countBtn.disabled = false;
    if (msg.error) { showToast(msg.error, 'error'); return; }
    nodes = msg.nodes;
    renderNodes();
  }

  if (msg.type === 'delete-hidden-done') {
    btnDelete.disabled = false;
    btnDelete.textContent = '🗑 Удалить скрытые слои';
    if (msg.error) {
      showToast(msg.error, 'error');
    } else {
      showToast('Успешно удалено слоёв: ' + msg.count, 'success');
    }
  }

  if (msg.type === 'done') {
    updateButtonsState();
    var txt = 'Готово! Заменено: ' + msg.replaced;
    if (msg.skipped > 0) txt += ' (пропущено: ' + msg.skipped + ')';
    showToast(txt, 'success');
  }
};

function showToast(text, type) {
  toast.textContent = text;
  toast.className = 'toast ' + type;
  setTimeout(function() { toast.className = 'toast'; }, 4000);
}

// Запускаем полную загрузку при старте
startBootstrap();
</script>
</body>
</html>
